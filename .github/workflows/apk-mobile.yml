# Construit l'APK Android de LexOS Mobile (dossier mobile/) sur GitHub, gratuitement.
# Se lance tout seul quand le dossier mobile/ change, ou à la main :
#   onglet « Actions » → « APK LexOS Mobile » → « Run workflow ».
# ~15-25 min plus tard : télécharge « LexOS-Mobile-apk » en bas de la page du build.
name: APK LexOS Mobile

on:
  push:
    branches: [claude, main]
    paths:
      - 'mobile/**'
      - '.github/workflows/apk-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Le SDK Android est déjà installé sur le runner GitHub ; pas besoin de setup-android.
      - name: Vérifier le SDK Android
        run: echo "ANDROID_HOME=$ANDROID_HOME · ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Installer les dépendances
        run: npm ci

      - name: Numéroter la version (versionCode = numéro du build)
        run: node -e "const f='app.json',c=JSON.parse(require('fs').readFileSync(f));c.expo.android.versionCode=100+Number(process.env.GITHUB_RUN_NUMBER);require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Générer le projet Android
        run: npx expo prebuild -p android --no-install

      - name: Compiler l'APK (arm64, pour les vrais téléphones)
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Signer avec la clé commune LexOS
        env:
          LEXOS_KEYSTORE_BASE64: ${{ secrets.LEXOS_KEYSTORE_BASE64 }}
          LEXOS_KEYSTORE_PASSWORD: ${{ secrets.LEXOS_KEYSTORE_PASSWORD }}
          LEXOS_KEY_ALIAS: ${{ secrets.LEXOS_KEY_ALIAS }}
        run: |
          if [ -z "$LEXOS_KEYSTORE_BASE64" ]; then
            echo "::warning::Clé commune LexOS absente (secrets non disponibles) : l'APK garde sa signature de test."
            exit 0
          fi
          echo "$LEXOS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lexos.keystore"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          for apk in android/app/build/outputs/apk/release/app-release.apk; do
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/lexos.keystore" --ks-key-alias "$LEXOS_KEY_ALIAS" \
              --ks-pass env:LEXOS_KEYSTORE_PASSWORD --key-pass env:LEXOS_KEYSTORE_PASSWORD \
              --out "$apk.signed" "$apk"
            mv "$apk.signed" "$apk"
            "$APKSIGNER" verify --print-certs "$apk" | head -n 3
          done
          rm -f "$RUNNER_TEMP/lexos.keystore"

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk LexOS-Mobile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LexOS-Mobile-apk
          path: mobile/LexOS-Mobile.apk

      - name: Publier un lien direct (Release publique)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create apk-mobile LexOS-Mobile.apk \
            --title "LexOS Mobile — APK (dernière version)" \
            --notes "IA locale sur la clé USB-C. Télécharge LexOS-Mobile.apk et installe-le sur ton téléphone (autorise les sources inconnues)." \
            --latest 2>/dev/null \
          || gh release upload apk-mobile LexOS-Mobile.apk --clobber
