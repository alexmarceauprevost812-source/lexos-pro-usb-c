name: Tester LexOS IA (clé USB-C)
on:
  push:
    branches: [claude]
    paths: ["usb/**", ".github/workflows/usb-ia.yml"]
  pull_request:
    paths: ["usb/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Récupérer REA (agent ti-lex) pour son test
        if: runner.os == 'Linux'
        run: git clone --depth 1 https://github.com/alexmarceauprevost812-source/ti-lex-ia-REA- "$RUNNER_TEMP/rea" && pip install requests
      - name: Tests LexOS IA
        working-directory: usb
        env:
          REA_SOURCE: ${{ runner.temp }}/rea
        run: python -m unittest discover -s tests -v
      - name: Vérifier les scripts shell
        if: runner.os == 'Linux'
        run: shellcheck -S warning usb/installer-sur-cle.sh usb/reformater-cle.sh usb/lexos-ia/ACTIVER-IA.sh usb/lexos-ia/raccourcis-bureau.sh
