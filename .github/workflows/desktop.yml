name: Construire versions PC
on:
  push:
    branches: [chatgpt]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier les projets
        working-directory: desktop
        run: python -m unittest discover -s tests -v
      - name: Installer le constructeur
        run: python -m pip install pyinstaller==6.16.0
      - name: Construire l’application
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name LexOS-Textes desktop/lexos_textes.py
      - uses: actions/upload-artifact@v4
        with:
          name: LexOS-Textes-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
