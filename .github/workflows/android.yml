name: Construire APK Android
on:
  push:
    branches: [chatgpt]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Préparer le SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0' 
      - name: Vérifier les noms des fichiers
        run: bash tests/verifier-noms.sh
      - name: Construire et contrôler Android
        run: gradle --no-daemon -PversionCode=$((100 + GITHUB_RUN_NUMBER)) assembleDebug lintDebug
      - name: Signer avec la clé commune LexOS
        env:
          LEXOS_KEYSTORE_BASE64: ${{ secrets.LEXOS_KEYSTORE_BASE64 }}
          LEXOS_KEYSTORE_PASSWORD: ${{ secrets.LEXOS_KEYSTORE_PASSWORD }}
          LEXOS_KEY_ALIAS: ${{ secrets.LEXOS_KEY_ALIAS }}
        run: |
          if [ -z "$LEXOS_KEYSTORE_BASE64" ]; then
            echo "::warning::Clé commune LexOS absente (secrets non disponibles) : l'APK garde sa signature de test."
            exit 0
          fi
          echo "$LEXOS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lexos.keystore"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          for apk in app/build/outputs/apk/debug/app-debug.apk; do
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/lexos.keystore" --ks-key-alias "$LEXOS_KEY_ALIAS" \
              --ks-pass env:LEXOS_KEYSTORE_PASSWORD --key-pass env:LEXOS_KEYSTORE_PASSWORD \
              --out "$apk.signed" "$apk"
            mv "$apk.signed" "$apk"
            "$APKSIGNER" verify --print-certs "$apk" | head -n 3
          done
          rm -f "$RUNNER_TEMP/lexos.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: lexos-textes-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Conserver les rapports Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-android
          path: android/app/build/reports/
          if-no-files-found: ignore
