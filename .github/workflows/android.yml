name: Construire APK Android
on:
  push:
    branches: [supabase]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Préparer le SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Vérifier les noms des fichiers
        run: bash tests/verifier-noms.sh
      - name: Construire et contrôler Android
        run: gradle --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lexos-textes-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
